<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>霓虹突围 · Neon Breakout</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: rgba(10, 14, 28, 0.86);
      --cyan: #4df3ff;
      --magenta: #ff4d9a;
      --gold: #ffd166;
      --text: #e8f4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: radial-gradient(1200px 700px at 50% -10%, #1a2250 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #wrap {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    #frame {
      position: relative;
      width: min(960px, 100vw - 16px);
      height: min(640px, 100dvh - 16px);
      border: 1px solid rgba(77, 243, 255, 0.28);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(77, 243, 255, 0.12), inset 0 0 80px rgba(20, 40, 90, 0.35);
      background: #05060c;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      letter-spacing: 0.4px;
    }
    .hud b { color: var(--cyan); }
    .bar {
      margin-top: 8px;
      width: 180px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff4d6d, #ffd166);
      transform-origin: left;
    }
    .xp {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .xp > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), #7cffb2);
    }
    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(4, 6, 14, 0.72);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .card {
      width: min(520px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid rgba(77, 243, 255, 0.25);
      border-radius: 16px;
      padding: 28px 26px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 {
      font-size: 34px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--cyan), #ffffff, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    .sub { opacity: 0.78; margin-bottom: 18px; line-height: 1.6; }
    .keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 20px; }
    .key {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #b8d4ee;
    }
    button {
      pointer-events: auto;
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      color: #061018;
      background: linear-gradient(180deg, #7af6ff, var(--cyan));
      box-shadow: 0 8px 24px rgba(77, 243, 255, 0.28);
    }
    button:hover { filter: brightness(1.08); }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: none;
      margin-left: 8px;
    }
    .choices {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .choice {
      text-align: left;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid rgba(77, 243, 255, 0.2);
      box-shadow: none;
      width: 100%;
    }
    .choice small { display: block; opacity: 0.7; font-weight: 500; margin-top: 4px; }
    .hidden { display: none !important; }
    .stats { margin: 10px 0 18px; opacity: 0.9; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="frame">
      <canvas id="game"></canvas>
      <div class="hud" id="hud" hidden>
        <div>
          生命 <b id="hpText">100</b>
          <div class="bar"><i id="hpBar"></i></div>
          等级 <b id="lvText">1</b>
        </div>
        <div style="text-align:right">
          分数 <b id="scoreText">0</b><br />
          波次 <b id="waveText">1</b><br />
          最高 <b id="bestText">0</b>
        </div>
        <div class="xp"><i id="xpBar"></i></div>
      </div>

      <div class="screen" id="start">
        <div class="card">
          <h1>霓虹突围</h1>
          <p class="sub">你是一艘霓虹战机。在虫群里杀出一条路，捡经验升级，撑得越久分数越高。</p>
          <div class="keys">
            <span class="key">WASD / 方向键 移动</span>
            <span class="key">自动瞄准射击</span>
            <span class="key">P 暂停</span>
          </div>
          <button id="btnStart">开始突围</button>
        </div>
      </div>

      <div class="screen hidden" id="pause">
        <div class="card">
          <h1>暂停</h1>
          <p class="sub">再冲一把。虫群不会等你。</p>
          <button id="btnResume">继续</button>
          <button class="ghost" id="btnQuit">回主菜单</button>
        </div>
      </div>

      <div class="screen hidden" id="levelup">
        <div class="card">
          <h1>升级</h1>
          <p class="sub">选一项强化，立刻生效。</p>
          <div class="choices" id="choices"></div>
        </div>
      </div>

      <div class="screen hidden" id="over">
        <div class="card">
          <h1>战机坠毁</h1>
          <div class="stats" id="overStats"></div>
          <button id="btnAgain">再来一局</button>
          <button class="ghost" id="btnHome">回主菜单</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const hpText = document.getElementById("hpText");
    const hpBar = document.getElementById("hpBar");
    const lvText = document.getElementById("lvText");
    const scoreText = document.getElementById("scoreText");
    const waveText = document.getElementById("waveText");
    const bestText = document.getElementById("bestText");
    const xpBar = document.getElementById("xpBar");

    const screens = {
      start: document.getElementById("start"),
      pause: document.getElementById("pause"),
      levelup: document.getElementById("levelup"),
      over: document.getElementById("over"),
    };

    const BEST_KEY = "neon-breakout-best";
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestText.textContent = best;

    const keys = new Set();
    let mode = "menu";
    let last = 0;
    let shake = 0;
    let W = 960, H = 640;

    const POOL = {
      bullets: [], enemies: [], gems: [], particles: [],
    };

    const ALL_UPGRADES = [
      { id: "firerate", name: "超频炮管", desc: "射击间隔缩短 18%" },
      { id: "damage", name: "高能弹芯", desc: "伤害 +4" },
      { id: "speed", name: "推进器改装", desc: "移动速度 +18" },
      { id: "multi", name: "分裂阵列", desc: "额外 +1 发子弹" },
      { id: "hp", name: "装甲强化", desc: "生命上限 +25，并回满" },
      { id: "magnet", name: "引力收集", desc: "经验吸取范围变大" },
      { id: "pierce", name: "穿透弹", desc: "子弹可再穿透 1 个敌人" },
      { id: "regen", name: "纳米修复", desc: "每秒回复 1.2 生命" },
    ];

    const state = resetState();

    function resetState() {
      return {
        player: {
          x: W / 2, y: H / 2, r: 14,
          hp: 100, maxHp: 100,
          speed: 230, fireCd: 0, fireRate: 0.28,
          damage: 12, bullets: 1, pierce: 0, magnet: 90, regen: 0,
          xp: 0, need: 20, lv: 1, invuln: 0,
        },
        bullets: [],
        enemies: [],
        gems: [],
        particles: [],
        score: 0,
        wave: 1,
        spawnT: 1.2,
        elapsed: 0,
        killCount: 0,
      };
    }

    function resize() {
      const frame = document.getElementById("frame");
      const rect = frame.getBoundingClientRect();
      W = Math.max(640, Math.floor(rect.width));
      H = Math.max(420, Math.floor(rect.height));
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener("resize", resize);

    addEventListener("keydown", (e) => {
      keys.add(e.code);
      if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
      if (e.code === "KeyP" && mode === "play") setMode("pause");
      else if (e.code === "KeyP" && mode === "pause") setMode("play");
      if ((e.code === "Enter" || e.code === "Space") && mode === "menu") startGame();
    });
    addEventListener("keyup", (e) => keys.delete(e.code));

    document.getElementById("btnStart").onclick = startGame;
    document.getElementById("btnResume").onclick = () => setMode("play");
    document.getElementById("btnQuit").onclick = () => setMode("menu");
    document.getElementById("btnAgain").onclick = startGame;
    document.getElementById("btnHome").onclick = () => setMode("menu");

    function setMode(next) {
      mode = next;
      Object.values(screens).forEach((el) => el.classList.add("hidden"));
      hud.hidden = next === "menu";
      if (next === "menu") screens.start.classList.remove("hidden");
      if (next === "pause") screens.pause.classList.remove("hidden");
      if (next === "levelup") screens.levelup.classList.remove("hidden");
      if (next === "over") screens.over.classList.remove("hidden");
    }

    function startGame() {
      Object.assign(state, resetState());
      state.player.x = W / 2;
      state.player.y = H / 2;
      hpText.textContent = "100";
      hpBar.style.transform = "scaleX(1)";
      lvText.textContent = "1";
      scoreText.textContent = "0";
      waveText.textContent = "1";
      xpBar.style.width = "0%";
      bestText.textContent = best;
      setMode("play");
      last = performance.now();
    }

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function spawnBurst(x, y, color, n = 10, speed = 180) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = rand(speed * 0.3, speed);
        state.particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: rand(0.25, 0.7), max: 0.7, r: rand(1.5, 3.5), color,
        });
      }
    }

    function spawnEnemy() {
      const edge = Math.floor(Math.random() * 4);
      let x = 0, y = 0;
      if (edge === 0) { x = rand(0, W); y = -20; }
      if (edge === 1) { x = rand(0, W); y = H + 20; }
      if (edge === 2) { x = -20; y = rand(0, H); }
      if (edge === 3) { x = W + 20; y = rand(0, H); }

      const elite = Math.random() < Math.min(0.08 + state.wave * 0.012, 0.28);
      const tank = !elite && Math.random() < 0.12;
      let hp = 16 + state.wave * 6;
      let speed = 70 + state.wave * 6;
      let r = 12;
      let color = "#ff6b9a";
      let score = 12;
      if (elite) {
        hp *= 2.4; speed += 40; r = 15; color = "#c084fc"; score = 28;
      } else if (tank) {
        hp *= 3.2; speed *= 0.55; r = 20; color = "#ffa94d"; score = 22;
      }
      state.enemies.push({ x, y, r, hp, maxHp: hp, speed, color, score, hit: 0 });
    }

    function nearestEnemy(from) {
      let bestE = null, bestD = 1e9;
      for (const e of state.enemies) {
        const d = dist(from, e);
        if (d < bestD) { bestD = d; bestE = e; }
      }
      return bestE;
    }

    function fire() {
      const p = state.player;
      const target = nearestEnemy(p);
      const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : -Math.PI / 2;
      const spread = (p.bullets - 1) * 0.14;
      for (let i = 0; i < p.bullets; i++) {
        const a = angle - spread / 2 + (p.bullets === 1 ? 0 : i * (spread / Math.max(1, p.bullets - 1)));
        state.bullets.push({
          x: p.x + Math.cos(a) * 16,
          y: p.y + Math.sin(a) * 16,
          vx: Math.cos(a) * 520,
          vy: Math.sin(a) * 520,
          r: 4,
          dmg: p.damage,
          pierce: p.pierce,
          life: 1.15,
        });
      }
    }

    function gainXp(n) {
      const p = state.player;
      p.xp += n;
      while (p.xp >= p.need) {
        p.xp -= p.need;
        p.lv += 1;
        p.need = Math.floor(20 + p.lv * 14);
        offerUpgrades();
      }
    }

    function offerUpgrades() {
      const pool = ALL_UPGRADES.filter((u) => {
        if (u.id === "multi" && state.player.bullets >= 5) return false;
        if (u.id === "pierce" && state.player.pierce >= 3) return false;
        return true;
      });
      const chosen = [];
      while (chosen.length < 3 && pool.length) {
        const i = Math.floor(Math.random() * pool.length);
        chosen.push(pool.splice(i, 1)[0]);
      }
      const box = document.getElementById("choices");
      box.innerHTML = "";
      chosen.forEach((u) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.innerHTML = `<strong>${u.name}</strong><small>${u.desc}</small>`;
        btn.onclick = () => applyUpgrade(u.id);
        box.appendChild(btn);
      });
      setMode("levelup");
    }

    function applyUpgrade(id) {
      const p = state.player;
      if (id === "firerate") p.fireRate = Math.max(0.09, p.fireRate * 0.82);
      if (id === "damage") p.damage += 4;
      if (id === "speed") p.speed += 18;
      if (id === "multi") p.bullets += 1;
      if (id === "hp") { p.maxHp += 25; p.hp = p.maxHp; }
      if (id === "magnet") p.magnet += 55;
      if (id === "pierce") p.pierce += 1;
      if (id === "regen") p.regen += 1.2;
      setMode("play");
      last = performance.now();
    }

    function update(dt) {
      const p = state.player;
      state.elapsed += dt;
      state.wave = 1 + Math.floor(state.elapsed / 18);
      p.invuln = Math.max(0, p.invuln - dt);
      if (p.regen) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);

      let mx = 0, my = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) my -= 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) my += 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) mx -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) mx += 1;
      if (mx || my) {
        const len = Math.hypot(mx, my);
        p.x += (mx / len) * p.speed * dt;
        p.y += (my / len) * p.speed * dt;
      }
      p.x = Math.max(p.r, Math.min(W - p.r, p.x));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y));

      p.fireCd -= dt;
      if (p.fireCd <= 0) {
        fire();
        p.fireCd = p.fireRate;
      }

      const spawnEvery = Math.max(0.18, 0.72 - state.wave * 0.04);
      state.spawnT -= dt;
      if (state.spawnT <= 0) {
        const n = 1 + (state.wave > 6 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0);
        for (let i = 0; i < n; i++) spawnEnemy();
        state.spawnT = spawnEvery;
      }

      for (const b of state.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
      }

      for (const e of state.enemies) {
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        e.x += Math.cos(a) * e.speed * dt;
        e.y += Math.sin(a) * e.speed * dt;
        e.hit = Math.max(0, e.hit - dt);
        if (dist(e, p) < e.r + p.r - 2 && p.invuln <= 0) {
          p.hp -= 14 + state.wave * 0.8;
          p.invuln = 0.55;
          shake = 10;
          spawnBurst(p.x, p.y, "#ff4d6d", 12, 220);
        }
      }

      for (const b of state.bullets) {
        for (const e of state.enemies) {
          if (e.hp <= 0 || b.life <= 0) continue;
          if (dist(b, e) < b.r + e.r) {
            e.hp -= b.dmg;
            e.hit = 0.08;
            b.pierce -= 1;
            if (b.pierce < 0) b.life = 0;
            spawnBurst(b.x, b.y, "#7af6ff", 5, 90);
            if (e.hp <= 0) {
              state.score += e.score;
              state.killCount += 1;
              spawnBurst(e.x, e.y, e.color, 16, 240);
              state.gems.push({ x: e.x, y: e.y, r: 6, v: 4 + Math.floor(e.score / 8) });
            }
          }
        }
      }

      for (const g of state.gems) {
        const d = dist(g, p);
        if (d < p.magnet) {
          const a = Math.atan2(p.y - g.y, p.x - g.x);
          const pull = 280 + (p.magnet - d) * 2;
          g.x += Math.cos(a) * pull * dt;
          g.y += Math.sin(a) * pull * dt;
        }
        if (dist(g, p) < p.r + 8) {
          g.dead = true;
          gainXp(g.v);
          state.score += 2;
        }
      }

      for (const pt of state.particles) {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vx *= 0.92;
        pt.vy *= 0.92;
        pt.life -= dt;
      }

      state.bullets = state.bullets.filter((b) => b.life > 0 && b.x > -40 && b.x < W + 40 && b.y > -40 && b.y < H + 40);
      state.enemies = state.enemies.filter((e) => e.hp > 0);
      state.gems = state.gems.filter((g) => !g.dead);
      state.particles = state.particles.filter((pt) => pt.life > 0);
      shake *= 0.86;

      if (p.hp <= 0) {
        p.hp = 0;
        if (state.score > best) {
          best = state.score;
          localStorage.setItem(BEST_KEY, String(best));
        }
        document.getElementById("overStats").innerHTML =
          `分数 <b>${state.score}</b>　击杀 <b>${state.killCount}</b>　波次 <b>${state.wave}</b>　等级 <b>${p.lv}</b><br/>最高纪录 <b>${best}</b>`;
        bestText.textContent = best;
        setMode("over");
      }

      hpText.textContent = Math.max(0, Math.ceil(p.hp));
      hpBar.style.transform = `scaleX(${Math.max(0, p.hp / p.maxHp)})`;
      lvText.textContent = p.lv;
      scoreText.textContent = state.score;
      waveText.textContent = state.wave;
      xpBar.style.width = `${(p.xp / p.need) * 100}%`;
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(90, 140, 220, 0.08)";
      ctx.lineWidth = 1;
      const gap = 48;
      const ox = (state.elapsed * 18) % gap;
      for (let x = -gap; x < W + gap; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x + ox, 0);
        ctx.lineTo(x + ox, H);
        ctx.stroke();
      }
      for (let y = -gap; y < H + gap; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y + ox * 0.4);
        ctx.lineTo(W, y + ox * 0.4);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.fillStyle = "#05060c";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      drawGrid();

      for (const g of state.gems) {
        ctx.beginPath();
        ctx.fillStyle = "#7cffb2";
        ctx.shadowColor = "#7cffb2";
        ctx.shadowBlur = 10;
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for (const e of state.enemies) {
        ctx.beginPath();
        ctx.fillStyle = e.hit > 0 ? "#ffffff" : e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(e.x - e.r, e.y - e.r - 7, e.r * 2, 3);
        ctx.fillStyle = "#ffd166";
        ctx.fillRect(e.x - e.r, e.y - e.r - 7, e.r * 2 * Math.max(0, e.hp / e.maxHp), 3);
      }

      for (const b of state.bullets) {
        ctx.beginPath();
        ctx.fillStyle = "#4df3ff";
        ctx.shadowColor = "#4df3ff";
        ctx.shadowBlur = 12;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      const p = state.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      const t = nearestEnemy(p);
      ctx.rotate(t ? Math.atan2(t.y - p.y, t.x - p.x) : -Math.PI / 2);
      ctx.shadowColor = "#4df3ff";
      ctx.shadowBlur = 18;
      ctx.fillStyle = p.invuln > 0 ? "rgba(255,255,255,0.85)" : "#dff9ff";
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-12, 10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, -10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      for (const pt of state.particles) {
        ctx.globalAlpha = Math.max(0, pt.life / pt.max);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now;
      if (mode === "play") update(dt);
      if (mode !== "menu") draw();
      else {
        ctx.fillStyle = "#05060c";
        ctx.fillRect(0, 0, W, H);
        drawGrid();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
